<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام المبيعات</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237550F0'/%3E%3Cpath d='M9 21l5-6 4 4 5-8' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  @font-face { font-family:'Huwiya'; src:url('/static/fonts/itfHuwiyaArabic-Light.otf') format('opentype'); font-weight:300; font-display:swap; }
  @font-face { font-family:'Huwiya'; src:url('/static/fonts/itfHuwiyaArabic-Regular.otf') format('opentype'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Huwiya'; src:url('/static/fonts/itfHuwiyaArabic-Regular.otf') format('opentype'); font-weight:500; font-display:swap; }
  @font-face { font-family:'Huwiya'; src:url('/static/fonts/itfHuwiyaArabic-Bold.otf') format('opentype'); font-weight:700; font-display:swap; }
  @font-face { font-family:'Huwiya'; src:url('/static/fonts/itfHuwiyaArabic-Bold.otf') format('opentype'); font-weight:800; font-display:swap; }

  :root {
    --bg:#0E0A24; --fg:#F5F3FF; --dim:#B9AFE0;
    --accent:#9B7CFF; --accent-rgb:155,124,255;
    --accent2:#4DC3F7; --accent2-rgb:77,195,247;
    --text-on-accent:#12082E;
    --surf-solid:#170f38;
    --surf1-rgb:35,24,82; --surf2-rgb:20,14,49; --input-bg-rgb:10,7,28;
    --glass:rgba(var(--accent-rgb),.06); --glass2:rgba(var(--accent-rgb),.1);
    --line:rgba(var(--accent-rgb),.16); --line2:rgba(var(--accent-rgb),.32);
    --grad:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    --grad-soft:linear-gradient(135deg, rgba(var(--accent-rgb),.14), rgba(var(--accent2-rgb),.11));
    --surf1:rgba(var(--surf1-rgb),.72); --surf2:rgba(var(--surf2-rgb),.62); --input-bg:rgba(var(--input-bg-rgb),.6);
    --ok:#5BD99A; --bad:#FF7B8A; --warn:#F5C26B;
    --orb-op1:.24; --orb-op2:.13;
  }
  :root[data-theme="light"] {
    --bg:#EFEBFB; --fg:#1E1642; --dim:#5B5188;
    --accent:#7550F0; --accent-rgb:117,80,240;
    --accent2:#1E7FC1; --accent2-rgb:30,127,193;
    --surf-solid:#FFFFFF;
    --surf1-rgb:255,255,255; --surf2-rgb:250,248,255; --input-bg-rgb:94,66,196;
    --glass:rgba(var(--accent-rgb),.08); --glass2:rgba(var(--accent-rgb),.14);
    --line:rgba(var(--accent-rgb),.22); --line2:rgba(var(--accent-rgb),.4);
    --surf1:rgba(var(--surf1-rgb),.96); --surf2:rgba(var(--surf2-rgb),.9); --input-bg:rgba(var(--input-bg-rgb),.075);
    --ok:#178A5C; --bad:#C93552; --warn:#9A6A12;
    --orb-op1:.1; --orb-op2:.06;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Huwiya',sans-serif; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--fg); min-height:100vh; overflow-x:hidden; transition:background .3s,color .3s; }

  .orbs { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .orb { position:absolute; border-radius:50%; filter:blur(100px); opacity:var(--orb-op1); transition:opacity .4s; }
  .orb1 { width:560px; height:560px; background:var(--accent); top:-180px; left:-120px; animation:drift1 26s ease-in-out infinite; }
  .orb2 { width:480px; height:480px; background:var(--accent2); bottom:-160px; right:-100px; animation:drift2 32s ease-in-out infinite; }
  .orb3 { width:320px; height:320px; background:var(--accent); top:38%; left:36%; opacity:var(--orb-op2); animation:drift3 38s ease-in-out infinite; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(90px,60px) scale(1.15)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-80px,-70px) scale(1.1)} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-60px,50px)} 66%{transform:translate(70px,-40px)} }
  @media (prefers-reduced-motion: reduce) { .orb, .view, .stat, .sec, .lead-card { animation:none !important; } }

  .topbar { position:fixed; top:0; right:0; left:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding:12px 26px; background:linear-gradient(180deg,rgba(var(--surf1-rgb),.88),rgba(var(--surf1-rgb),.72)); backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line); gap:16px; }
  .brand { display:flex; align-items:center; gap:11px; font-weight:800; font-size:17px; white-space:nowrap; }
  .brand-mark { width:34px; height:34px; border-radius:11px; background:var(--grad); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(var(--accent-rgb),.35); }
  .brand-mark svg { width:19px; height:19px; stroke:var(--text-on-accent); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .topnav { display:flex; gap:4px; flex:1; justify-content:center; }
  .tnav { display:flex; align-items:center; gap:7px; padding:8px 13px; border-radius:12px; white-space:nowrap; cursor:pointer; color:var(--dim); font-size:14px;
    transition:all .22s ease; border:none; background:none; position:relative; }
  .tnav:hover { color:var(--fg); }
  .tnav.on { color:var(--fg); font-weight:700; background:var(--grad-soft); box-shadow:inset 0 0 0 1px var(--line2); }
  .tnav svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .tnav .badge { background:var(--grad); color:var(--text-on-accent); border-radius:20px; font-size:11px; font-weight:800; padding:1px 7px; min-width:20px; text-align:center; }
  .top-actions { display:flex; align-items:center; gap:8px; }
  .icon-btn { width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--glass); color:var(--dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s; }
  .icon-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .icon-btn:hover { color:var(--fg); border-color:var(--line2); background:var(--glass2); transform:translateY(-1px); }
  .cap { font-size:12.5px; color:var(--dim); display:flex; align-items:center; gap:7px; padding:0 8px; white-space:nowrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 7px rgba(91,217,154,.7); animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.6; transform:scale(1.25)} }

  main { max-width:1240px; margin:0 auto; padding:92px 28px 60px; position:relative; z-index:1; }
  .view { animation:viewIn .45s cubic-bezier(.22,.9,.35,1) both; }
  @keyframes viewIn { from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:translateY(0)} }
  h1 { font-size:30px; font-weight:800; margin-bottom:6px; line-height:1.4; }
  h1 em { font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color:var(--dim); font-size:15px; margin-bottom:26px; }
  .view-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:26px; }
  .stat { background:linear-gradient(145deg,var(--surf1),var(--surf2)); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:20px; padding:22px 24px;
    transition:all .28s ease; animation:cardIn .5s ease both; }
  .stat:hover { transform:translateY(-3px); border-color:var(--line2); box-shadow:0 10px 26px rgba(0,0,0,.3), 0 0 16px rgba(var(--accent-rgb),.1); }
  @keyframes cardIn { from{opacity:0; transform:translateY(22px) scale(.97)} to{opacity:1; transform:translateY(0) scale(1)} }
  .stat .n { font-size:42px; font-weight:800; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1.3; }
  .stat .l { color:var(--dim); font-size:13.5px; margin-top:2px; }
  .stat .meter { height:6px; border-radius:6px; background:var(--glass2); margin-top:12px; overflow:hidden; }
  .stat .meter i { display:block; height:100%; background:var(--grad); border-radius:6px; transition:width .5s ease; }

  .sec { background:linear-gradient(145deg,var(--surf1),var(--surf2)); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:20px; padding:24px; margin-bottom:22px; animation:cardIn .5s ease both; }
  .sec h2 { font-size:18px; font-weight:700; margin-bottom:16px; }
  .sec h2 small { color:var(--dim); font-weight:400; font-size:12.5px; margin-inline-start:8px; }
  .two { display:grid; grid-template-columns:1.3fr 1fr; gap:22px; }
  @media (max-width:1000px){ .two{grid-template-columns:1fr} .topnav{display:none} main{padding-top:84px} .bottombar{display:flex!important} main{padding-bottom:100px} }

  .bar-row { display:grid; grid-template-columns:130px 1fr 38px; gap:12px; align-items:center; padding:7px 0; font-size:14px; }
  .bar-row .track { height:10px; border-radius:10px; background:var(--glass2); overflow:hidden; }
  .bar-row .track i { display:block; height:100%; background:var(--grad); border-radius:10px; transition:width .5s ease; }
  .bar-row .num { color:var(--dim); text-align:end; font-variant-numeric:tabular-nums; }

  .btn { background:var(--grad); color:var(--text-on-accent); border:none; border-radius:13px; padding:12px 24px; font-size:15px; font-weight:700;
    cursor:pointer; transition:all .22s ease; box-shadow:0 4px 14px rgba(var(--accent-rgb),.24); }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(var(--accent-rgb),.34); filter:brightness(1.06); }
  .btn:active { transform:translateY(0) scale(.97); }
  .btn:disabled { opacity:.5; cursor:wait; transform:none; }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--line2); box-shadow:none; }
  .btn.ghost:hover { border-color:var(--accent); background:var(--glass2); box-shadow:none; }
  .btn.danger { background:transparent; color:var(--bad); border:1px solid rgba(255,123,138,.4); box-shadow:none; }
  .btn.danger:hover { background:rgba(255,123,138,.1); }
  .btn.sm { padding:7px 15px; font-size:13px; }

  input, select, textarea { background:var(--input-bg); border:1px solid var(--line); color:var(--fg); border-radius:13px; padding:11px 15px; font-size:14.5px; transition:.25s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.14); }
  input::placeholder, textarea::placeholder { color:var(--dim); opacity:.8; }
  select option { background:var(--surf-solid); color:var(--fg); }
  .filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .filters input { flex:1; min-width:200px; }

  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border:1px solid var(--line); border-radius:30px; font-size:12.5px; color:var(--dim); background:var(--glass); text-decoration:none; transition:.2s; }
  a.chip:hover { color:var(--fg); border-color:var(--line2); }
  .chip.code { color:var(--fg); background:var(--grad-soft); border-color:var(--line2); font-weight:700; }
  .chip.demo { color:var(--warn); border-color:var(--warn); }
  .chip.ok { color:var(--ok); border-color:currentColor; } .chip.warn { color:var(--warn); border-color:currentColor; } .chip.bad { color:var(--bad); border-color:currentColor; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }

  .lead-card { border:1px solid var(--line); background:linear-gradient(145deg,var(--surf1),var(--surf2)); backdrop-filter:blur(14px); border-radius:20px; padding:22px 24px; margin-bottom:18px; animation:cardIn .45s ease both; }
  .lead-card.leaving { opacity:0; transform:translateX(-30px) scale(.97); transition:.35s ease; }
  .lc-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .lc-head h3 { font-size:20px; font-weight:800; margin-bottom:6px; }
  .lc-loc { color:var(--dim); font-size:13.5px; }
  .scores { display:flex; gap:10px; }
  .score { text-align:center; min-width:74px; padding:8px 12px; border-radius:14px; border:1px solid var(--line); background:var(--glass); }
  .score b { display:block; font-size:24px; font-weight:800; line-height:1.3; }
  .score small { color:var(--dim); font-size:11.5px; }
  .score.ok b { color:var(--ok); } .score.warn b { color:var(--warn); } .score.bad b { color:var(--bad); }
  .lc-body { display:grid; grid-template-columns:1fr 1.25fr; gap:22px; }
  @media (max-width:900px){ .lc-body{grid-template-columns:1fr} }
  .lc-why { font-size:14.5px; line-height:1.9; margin-bottom:12px; }
  .lc-why .src { font-size:12px; color:var(--accent); text-decoration:none; margin-inline-start:6px; }
  .lc-why .src:hover { text-decoration:underline; }
  .label { font-size:12.5px; color:var(--dim); margin-bottom:6px; display:block; }
  .lc-msg textarea { width:100%; min-height:190px; line-height:1.95; resize:vertical; font-size:14.5px; }
  .lc-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .lc-actions .spacer { flex:1; }
  .lc-actions select { padding:9px 13px; }
  .hint { font-size:12px; color:var(--dim); }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:start; color:var(--dim); font-weight:500; font-size:12.5px; padding:10px 12px; border-bottom:1px solid var(--line); }
  td { padding:13px 12px; border-bottom:1px solid var(--line); }
  tbody tr { cursor:pointer; transition:background .2s; }
  tbody tr:hover { background:var(--glass); }
  .tbl-wrap { overflow-x:auto; }

  .kanban { display:flex; gap:14px; overflow-x:auto; padding-bottom:12px; align-items:flex-start; }
  .kcol { flex:0 0 250px; background:var(--glass); border:1px solid var(--line); border-radius:18px; padding:14px; }
  .kcol h4 { font-size:14px; font-weight:700; display:flex; justify-content:space-between; margin-bottom:12px; }
  .kcol h4 span { color:var(--dim); font-weight:400; }
  .kcard { background:linear-gradient(145deg,var(--surf1),var(--surf2)); border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:9px; cursor:pointer; transition:.2s; font-size:13.5px; }
  .kcard:hover { border-color:var(--line2); transform:translateY(-2px); }
  .kcard small { color:var(--dim); display:block; margin-top:3px; }

  .drawer-shade { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; opacity:0; pointer-events:none; transition:.25s; }
  .drawer-shade.on { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; bottom:0; left:0; width:min(560px,100vw); background:var(--surf-solid); border-inline-end:1px solid var(--line2); z-index:41; transform:translateX(-102%); transition:transform .3s cubic-bezier(.22,.9,.35,1); overflow-y:auto; padding:26px; }
  .drawer.on { transform:translateX(0); }
  .drawer h2 { font-size:22px; font-weight:800; margin-bottom:6px; }
  .frow { padding:11px 0; border-bottom:1px solid var(--line); }
  .frow b { display:block; font-size:12.5px; color:var(--dim); font-weight:500; margin-bottom:3px; }
  .frow .val { overflow-wrap:anywhere; line-height:1.8; }
  .frow .obs { font-size:12px; color:var(--dim); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .frow .obs a { color:var(--accent); text-decoration:none; }
  .timeline { margin-top:6px; }
  .tl { display:flex; gap:12px; padding:9px 0; font-size:13.5px; }
  .tl .pt { width:9px; height:9px; border-radius:50%; background:var(--grad); margin-top:7px; flex-shrink:0; }
  .tl small { color:var(--dim); display:block; }

  .empty { text-align:center; padding:56px 20px; color:var(--dim); }
  .empty .big { font-size:44px; margin-bottom:10px; }
  .empty h3 { color:var(--fg); font-size:19px; margin-bottom:6px; }
  .soon { text-align:center; padding:70px 20px; }
  .soon h3 { font-size:22px; margin-bottom:8px; }
  .soon p { color:var(--dim); max-width:520px; margin:0 auto; line-height:1.9; }

  .toast { position:fixed; bottom:26px; right:50%; transform:translateX(50%) translateY(20px); background:var(--surf-solid); border:1px solid var(--line2); padding:12px 22px; border-radius:14px; z-index:60; opacity:0; transition:.3s; font-size:14.5px; box-shadow:0 12px 34px rgba(0,0,0,.4); max-width:90vw; }
  .toast.on { opacity:1; transform:translateX(50%) translateY(0); }
  .toast.err { border-color:var(--bad); color:var(--bad); }

  .bottombar { display:none; position:fixed; bottom:0; right:0; left:0; z-index:20; justify-content:center; gap:4px; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(var(--surf1-rgb),.94),rgba(var(--surf1-rgb),.78)); backdrop-filter:blur(18px); border-top:1px solid var(--line); }
  .bnav { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 12px; border-radius:13px; cursor:pointer; color:var(--dim); font-size:11px; border:none; background:none; }
  .bnav svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .bnav.on { color:var(--fg); font-weight:700; background:var(--grad-soft); }
  .bnav.on svg { stroke:var(--accent); }
  .run-row { border:1px solid var(--line); background:var(--glass); border-radius:14px; padding:13px 16px; margin-bottom:10px; cursor:pointer; transition:.2s; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .run-row:hover, .run-row.sel { border-color:var(--line2); background:var(--glass2); }
  .run-row small { color:var(--dim); display:block; margin-top:3px; }
  .logbox { max-height:380px; overflow-y:auto; border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--input-bg); font-size:13.5px; line-height:1.9; }
  .logline { display:flex; gap:10px; } .logline time { color:var(--dim); font-size:12px; flex-shrink:0; direction:ltr; }
  .logline.warn { color:var(--warn); } .logline.error { color:var(--bad); }
  .formrow { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .formrow label { display:block; font-size:12.5px; color:var(--dim); margin-bottom:6px; }
  .formrow .grow { flex:1; min-width:170px; } .formrow input, .formrow select { width:100%; }
  .notice { border:1px solid var(--warn); color:var(--warn); border-radius:14px; padding:13px 16px; margin-bottom:18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:space-between; }
  .concerns { margin-top:12px; border:1px solid var(--warn); border-radius:14px; padding:10px 14px; font-size:13px; line-height:1.8; }
  .concerns b { color:var(--warn); display:block; margin-bottom:2px; }
  .concerns a { color:var(--accent); text-decoration:none; margin-inline-start:6px; }
  .checks { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 17l5-6 4 4 7-9"/></svg></div>
    <span>نظام المبيعات</span>
  </div>
  <nav class="topnav" id="topnav"></nav>
  <div class="top-actions">
    <div class="cap" title="المرسَل اليوم مقابل الحد اليومي"><span class="dot"></span><span id="cap-text">—</span></div>
    <button class="icon-btn" id="theme-btn" aria-label="تبديل الثيم" title="تبديل الثيم">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main><div id="view" class="view"></div></main>
<nav class="bottombar" id="bottombar"></nav>
<div class="drawer-shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-label="تفاصيل العميل"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
const COUNTRY = { SA:'السعودية', QA:'قطر', KW:'الكويت', OM:'عُمان', AE:'الإمارات', JO:'الأردن' };
const CHANNELS = { whatsapp:'واتساب', email:'إيميل', linkedin:'لينكدإن', instagram:'إنستغرام' };
const PIPELINE = [
  ['discovered','مكتشف'], ['enriched','مُثرى'], ['verified','مُتحقَّق'], ['scored','مُقيَّم'],

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'href') { if (/^https?:\/\//i.test(v)) { el.href = v; el.target = '_blank'; el.rel = 'noopener noreferrer'; } }
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

/* ---------- صفحات لاحقة ---------- */
let pollTimer = null;
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
const RUN_STATUS = { queued:['بالانتظار',''], running:['يعمل الآن','ok'], paused:['متوقف مؤقتًا','warn'], done:['اكتمل','ok'], failed:['فشل','bad'], cancelled:['أُلغي',''] };

async function viewRun(v) {
  const settings = await api('/api/settings');
  const icps = await api('/api/icps');
  const code = h('select', { 'aria-label':'الشريحة' }, icps.map((i) => h('option', { value:i.code }, `${i.code} · ${i.name}`)));
  const country = h('select', { 'aria-label':'الدولة' }, Object.entries(COUNTRY).map(([k, l]) => h('option', { value:k }, l)));
  const city = h('input', { placeholder:'المدينة، مثلًا الرياض', 'aria-label':'المدينة' });
  const count = h('input', { type:'number', min:'1', max:'50', value:'5', 'aria-label':'العدد' });
  const startBtn = h('button', { class:'btn', onclick: async () => {
    startBtn.disabled = true;
    try { const r = await api('/api/runs', { code: code.value, country: country.value, city: city.value, count: Number(count.value) }); selected = r.id; lastLog = 0; logBox.replaceChildren(); toast('بدأ التشغيل'); await tick(); }
    catch (e) { toast(e.message, true); }
    startBtn.disabled = false;
  } }, 'ابدأ البحث');
  const listBox = h('div', {}), logBox = h('div', { class:'logbox', 'aria-live':'polite' });
  let selected = null, lastLog = 0;

  async function tick() {
    const runs = await api('/api/runs');
    if (selected == null && runs.length) selected = runs[0].id;
    listBox.replaceChildren(...(runs.length ? runs.map((r) => {
      const [label, cls] = RUN_STATUS[r.status] || [r.status, ''];
      const s = r.summary || {}, p = r.params;
      const info = s.discovered != null ? `اكتُشف ${s.discovered} · متبقٍ ${(s.remaining || []).length}` : 'يبحث…';
      return h('div', { class:'run-row' + (r.id === selected ? ' sel' : ''), onclick: () => { selected = r.id; lastLog = 0; logBox.replaceChildren(); tick(); } },
        h('div', {}, h('b', {}, `#${r.id} · ${p.code} · ${p.city} · ${COUNTRY[p.country] || p.country}`), h('small', {}, `${info} · العدد المطلوب ${p.count}`)),
        h('div', { class:'chips' }, h('span', { class:'chip ' + cls }, label),
          r.status === 'running' ? h('button', { class:'btn danger sm', onclick: async (e) => { e.stopPropagation(); await api(`/api/runs/${r.id}/cancel`, {}); toast('طُلب الإلغاء'); } }, 'إلغاء') : null,
          r.status === 'paused' ? h('button', { class:'btn sm', onclick: async (e) => { e.stopPropagation(); try { await api(`/api/runs/${r.id}/resume`, {}); toast('تم الاستئناف'); tick(); } catch (er) { toast(er.message, true); } } }, 'استئناف') : null));
    }) : [h('p', { class:'hint' }, 'لا توجد تشغيلات بعد')]));
    if (selected != null) {
      const run = await api(`/api/runs/${selected}?after=${lastLog}`);
      for (const l of run.logs) { lastLog = l.id; logBox.append(h('div', { class:'logline ' + l.level }, h('time', {}, new Date(l.at).toLocaleTimeString('en-GB')), l.message)); }
      if (run.logs.length) logBox.scrollTop = logBox.scrollHeight;
    }
    refreshSummary().catch(() => {});
  }

  mount(v, 
    h('div', { class:'view-head' }, h('div', {}, h('h1', {}, 'التشغيل و', h('em', {}, 'البحث')),
      h('p', { class:'sub' }, 'يبحث الوكيل في الويب ويتحقق ويقيّم ويجهّز الرسائل. النتائج المناسبة تصل صندوق الاعتماد.'))),
    (settings.company_name && settings.sender_name) ? null : h('div', { class:'notice' }, h('span', {}, 'اسم المرسل واسم الشركة غير مضبوطين، وهما لازمان لتوقيع الرسائل.'), h('button', { class:'btn sm', onclick: () => go('set') }, 'اضبطه الآن')),
    h('div', { class:'sec' }, h('h2', {}, 'حملة بحث جديدة', h('small', {}, 'كل عميل يستغرق دقيقة إلى ثلاث، والبحث يستهلك من اشتراكك')),
      h('div', { class:'formrow' },
        h('div', { class:'grow' }, h('label', {}, 'الشريحة'), code), h('div', { class:'grow' }, h('label', {}, 'الدولة'), country),
        h('div', { class:'grow' }, h('label', {}, 'المدينة'), city), h('div', { style:'width:110px' }, h('label', {}, 'العدد (حتى 50)'), count), startBtn)),
    h('div', { class:'sec' }, h('h2', {}, 'التشغيلات'), listBox),
    h('div', { class:'sec' }, h('h2', {}, 'السجل المباشر'), logBox));
  await tick();
  pollTimer = setInterval(() => tick().catch(() => {}), 3000);
}

async function viewSet(v) {
  const s = await api('/api/settings');
  const company = h('input', { value: s.company_name, placeholder:'اسم الشركة كما يظهر بالتوقيع', 'aria-label':'اسم الشركة' });
  const sender = h('input', { value: s.sender_name, placeholder:'اسمك كما يظهر بالتوقيع', 'aria-label':'اسم المرسل' });
  mount(v, 
    h('div', { class:'view-head' }, h('div', {}, h('h1', {}, h('em', {}, 'الإعدادات')), h('p', { class:'sub' }, 'إعدادات النظام الأساسية'))),
    h('div', { class:'sec' }, h('h2', {}, 'التوقيع'),
      h('p', { class:'hint', style:'margin-bottom:12px' }, 'يظهر بنهاية كل رسالة: «اسم المرسل | اسم الشركة»'),
      h('div', { class:'formrow' }, h('div', { class:'grow' }, h('label', {}, 'اسم المرسل'), sender), h('div', { class:'grow' }, h('label', {}, 'اسم الشركة'), company),
        h('button', { class:'btn', onclick: async () => { try { await api('/api/settings', { company_name: company.value, sender_name: sender.value }); toast('تم الحفظ'); } catch (e) { toast(e.message, true); } } }, 'حفظ'))),
    h('div', { class:'sec' }, h('h2', {}, 'قواعد الشرائح والقنوات والحدود'),
      h('p', { class:'hint' }, 'تُعدَّل حاليًا من ملفات config/icp. محرر مرئي لها يأتي مع مرحلة الإرسال.')));
}

/* ---------- بطاقة العميل الجانبية ---------- */
async function openDrawer(id) {
  const d = $('drawer'); d.replaceChildren(h('p', { class:'hint' }, 'جارٍ التحميل…'));
  $('shade').classList.add('on'); d.classList.add('on');
  try {
    const l = await api('/api/leads/' + id);
    const pretty = (k, o) => { if (k !== 'identity') return o.value; try { const d = JSON.parse(o.value); return d.phone ? `${d.name} — ${d.phone}` : d.name; } catch (e) { return o.value; } };
    const rows = Object.entries(l.observations).filter(([k]) => !['message', 'message_final', 'demo', 'verification_checks'].includes(k)).map(([k, obs]) => {
      const last = obs[obs.length - 1];
      return h('div', { class:'frow' }, h('b', {}, FIELD_LABELS[k] || k), h('div', { class:'val' }, k === 'identity' ? obs.map((o) => h('div', {}, h('bdi', {}, pretty(k, o)))) : h('bdi', {}, last.value)),
        h('div', { class:'obs' }, obs.map((o) => h('span', { class:'chip' }, SOURCE_CLASS[o.source_class] || o.source_class, ` · ثقة ${Math.round(o.confidence * 100)}%`,
          /^https?:/.test(o.source_url) ? h('a', { href:o.source_url }, ' ↗') : null))));
    });
    d.replaceChildren(
      h('div', { style:'display:flex;justify-content:space-between;gap:10px;align-items:flex-start' }, h('div', {}, h('h2', {}, l.name), h('div', { class:'chips' }, h('span', { class:'chip code' }, l.code), h('span', { class:'chip' }, where(l)), h('span', { class:'chip' }, l.state_label))),
        h('button', { class:'icon-btn', onclick: closeDrawer, 'aria-label':'إغلاق' }, svg('run'))),
      h('h2', { style:'font-size:16px;margin:22px 0 4px' }, 'البيانات ومصادرها'), ...(rows.length ? rows : [h('p', { class:'hint' }, 'لا توجد بيانات مجمّعة بعد')]),
      h('h2', { style:'font-size:16px;margin:24px 0 4px' }, 'السجل الزمني'),
      h('div', { class:'timeline' }, l.history.map((e) => h('div', { class:'tl' }, h('span', { class:'pt' }), h('div', {}, e.reason, h('small', {}, new Date(e.at).toLocaleString('ar')))))));
    d.querySelector('.icon-btn svg').innerHTML = '<path d="M6 6l12 12M18 6L6 18"/>';
  } catch (e) { d.replaceChildren(h('p', {}, e.message)); }
}
function closeDrawer() { $('shade').classList.remove('on'); $('drawer').classList.remove('on'); }
$('shade').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

const VIEWS = { dash: viewDash, inbox: viewInbox, leads: viewLeads, flow: viewFlow, run: viewRun, set: viewSet };
go('dash');
</script>
</body>
