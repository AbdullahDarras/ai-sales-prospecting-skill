# مثال شريحة: شركة خدمية صغيرة أو متوسطة تغرق بالشغل اليدوي (واتساب وإكسل).
# هذا مثال للتعديل. السعر لا يدخل في أي قاعدة أو رسالة.
code: TEC-2
name: شركة صغيرة أو متوسطة غارقة بالشغل اليدوي
description: >
  شركة خدمية فيها 5 إلى 50 موظفًا، لديها خدمة عملاء أو مبيعات أو حجوزات،
  وتدير الطلبات والمحادثات يدويًا عبر واتساب وإكسل. رسائل تضيع وردود تتأخر،
  وموظف يقضي وقته في تكرار نفس الردود.
specialties: [شركات عقارات, مراكز تدريب, وكالات سفر وسياحة, مراكز خدمة وصيانة, شركات خدمات للأفراد أو الأعمال]
team_noun: موظفين
team_noun_large: موظفًا
min_team: 5
max_team: 50
decision_maker: المالك أو مدير العمليات
decision_maker_titles: [المالك, مؤسس, مدير العمليات, المدير العام]
discover_priority: شركات خدمية مستقلة متوسطة الحجم (5 إلى 50 موظفًا) تتعامل مع عملاء يوميًا عبر واتساب أو الهاتف أو الحجز. ابتعد عن الشركات الكبرى والمجموعات والجهات الحكومية.
large_hint: شركة كبيرة أو مجموعة شركات أو جهة حكومية (أكثر من 50 موظفًا)
exclusions:
  - شركة كبيرة فيها أكثر من 50 موظفًا أو مجموعة شركات
  - فرد أو مستقل بلا فريق (أقل من 5 موظفين)
  - جهة حكومية أو شبه حكومية
  - شركة تقنية أو وكالة أتمتة منافسة
  - منشأة مغلقة نهائيًا أو لا يوجد دليل على أنها تعمل
fit_signals:
  - الموقع أو الحساب يعتمد على واتساب كقناة وحيدة للحجز أو الطلب
  - لا يوجد نظام حجز أو نموذج طلب منظم على الموقع
  - إعلان توظيف لموظف خدمة عملاء أو مبيعات (ضغط بالطلبات)
  - شكاوى علنية من بطء الرد على السوشال أو الخرائط
  - موسم ضغط أو توسع بفرع جديد
  - المالك أو مدير العمليات معروف بالاسم
search_hints:
  - شركات عقارات صغيرة ومتوسطة في {city}، {country}
  - مراكز تدريب خاصة في {city}، {country}
  - وكالات سفر وسياحة في {city}، {country}
  - شركات خدمات للأفراد تتلقى الطلبات عبر واتساب في {city}
  - مدير العمليات شركة خدمات {city} لينكدإن
source_hints:
  - خرائط جوجل ونتائجه
  - مواقع الشركات الرسمية
  - غرف التجارة والصناعة وسجلاتها العامة
  - أدلة الشركات
  - لينكدإن للتعرف على المالك أو مدير العمليات
  - إعلانات التوظيف العامة
channel_order: [linkedin, email, whatsapp]
first_offer: تدقيق مجاني لعملية واحدة متكررة، مع تقدير الساعات التي يوفرها تحويلها لآلية
