# مثال شريحة: عيادة خاصة (أسنان وعلاج طبيعي) تحتاج حضورًا شهريًا على السوشال ميديا.
# هذا مثال للتعديل. السعر لا يدخل في أي قاعدة أو رسالة.
code: VIS-1
name: عيادة خاصة تحتاج حضورًا شهريًا
description: >
  عيادة خاصة صغيرة فيها طبيب إلى ثلاثة أطباء، يملكها الطبيب نفسه غالبًا،
  وتقدم علاجات ذات قيمة عالية للمريض مثل الزراعة والتقويم الشفاف في الأسنان.
  حسابها على السوشال ميديا خامل أو عشوائي، ومنافسون أقل منها طبيًا يجذبون المرضى بحضورهم.
specialties: [أسنان, علاج طبيعي]
team_noun: أطباء
team_noun_large: طبيبًا
max_team: 3
discover_priority: عيادات يملكها ويديرها طبيب واحد (تُسمّى غالبًا باسم الطبيب)، أو فيها طبيبان أو ثلاثة على الأكثر. العيادة التابعة لمستشفى مقبولة إن كان فيها طبيب إلى ثلاثة. ابتعد عن المجمعات والسلاسل الكبيرة.
large_hint: مجمع طبي أو سلسلة عيادات كبيرة (أكثر من ثلاثة أطباء)
decision_maker: الطبيب المالك (لا تُراسَل السكرتارية)
decision_maker_titles: [طبيب مالك, مدير العيادة, المالك, مؤسس]
exclusions:
  - مجمع طبي أو سلسلة عيادات فيها أكثر من 3 أطباء (العيادة التابعة لمستشفى مقبولة إن كان فيها 1 إلى 3 أطباء)
  - مركز أو عيادة حكومية أو تابعة لجهة حكومية
  - تخصص خارج الأسنان والعلاج الطبيعي (ومنه التجميل)
  - منشأة مغلقة نهائيًا أو لا يوجد دليل على أنها تعمل
fit_signals:
  - فرع جديد أو افتتاح قريب
  - جهاز أو علاج جديد أُعلن عنه
  - طبيب جديد انضم للعيادة
  - حساب إنستغرام نشط لكن تفاعله ضعيف أو محتواه عشوائي
  - حساب خامل بينما العيادة تعمل فعلًا
  - الطبيب المالك ظاهر باسمه على موقع العيادة أو حساباتها
search_hints:
  - عيادة د. طبيب أسنان خاصة في {city}، {country} (عيادة باسم الطبيب)
  - عيادة أسنان بطبيب واحد في {city}
  - حسابات إنستغرام لأطباء أسنان مستقلين في {city}
  - عيادات أسنان خاصة صغيرة في {city}، {country}
  - عيادات علاج طبيعي خاصة في {city}، {country}
  - دليل أطباء الأسنان والعلاج الطبيعي في {city}
  - عيادة أسنان {city} افتتاح فرع جديد
  - حسابات إنستغرام عيادات أسنان {city}
source_hints:
  - خرائط جوجل ونتائجه
  - مواقع العيادات الرسمية
  - أدلة الأطباء والعيادات
  - السجلات الرسمية للجهة الصحية في الدولة (وزارة الصحة أو هيئة التخصصات أو النقابة)
  - إنستغرام وحسابات السوشال العامة
  - لينكدإن للتعرف على اسم الطبيب المالك
channel_order: [whatsapp, instagram, email]
first_offer: تدقيق مجاني لحساب العيادة خلال 15 دقيقة، مع ثلاث ملاحظات قابلة للتطبيق فورًا
