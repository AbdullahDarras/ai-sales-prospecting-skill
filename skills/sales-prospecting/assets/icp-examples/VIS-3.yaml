# مثال شريحة: مطعم أو كافيه مستقل يحتاج حضورًا شهريًا على السوشال ميديا.
# هذا مثال للتعديل. السعر لا يدخل في أي قاعدة أو رسالة.
code: VIS-3
name: مطعم أو كافيه يحتاج حضورًا شهريًا
description: >
  مطعم أو كافيه مستقل بفرع واحد إلى عدة فروع قليلة، صاحبه يقرر بسرعة.
  صور المنيو ملتقطة بالجوال، والمحتوى المرئي قليل (ريلز نادرة)،
  ومنافسون يملؤون التوصيل والسوشال ميديا بحضور أقوى.
specialties: [مطعم, كافيه, مقهى, مخبز وحلويات]
team_noun: عاملين
max_branches: 5
decision_maker: المالك أو الشريك المدير
decision_maker_titles: [المالك, الشريك المدير, المدير العام]
discover_priority: مطاعم وكافيهات مستقلة يملكها ويديرها صاحبها، بفرع واحد إلى خمسة فروع. ابتعد عن السلاسل الدولية والفرنشايز الكبير.
large_hint: سلسلة دولية أو فرنشايز كبير أو أكثر من خمسة فروع
exclusions:
  - سلسلة دولية أو فرنشايز معروف أو أكثر من 5 فروع
  - منشأة مغلقة نهائيًا أو لا يوجد دليل على أنها تعمل
  - منشأة داخل جهة حكومية أو بإدارة مركزية لا يملك صاحبها القرار
fit_signals:
  - منيو جديد أو عروض جديدة معلنة
  - افتتاح فرع جديد أو افتتاح المنشأة خلال آخر ستة أشهر
  - صور المنيو أو الأطباق ضعيفة الجودة أو ملتقطة بالجوال
  - ريلز قليلة أو نشر غير منتظم
  - حضور على تطبيقات التوصيل مع حضور ضعيف على السوشال ميديا
  - اقتراب موسم رمضان أو الصيف
  - المالك أو الشريك المدير ظاهر باسمه
search_hints:
  - مطاعم جديدة افتتحت في {city}، {country} خلال آخر ستة أشهر
  - كافيهات مستقلة في {city}، {country}
  - مطاعم محلية بفرع أو فرعين في {city} على تطبيقات التوصيل
  - حسابات إنستغرام لمطاعم وكافيهات مستقلة في {city}
  - مطعم في {city} افتتاح فرع جديد
source_hints:
  - خرائط جوجل ونتائجه
  - تطبيقات التوصيل وصفحات المطاعم عليها
  - إنستغرام وحسابات السوشال العامة
  - مواقع المطاعم والكافيهات الرسمية
  - أخبار وقوائم المطاعم الجديدة في المدينة
channel_order: [whatsapp, instagram, email]
first_offer: جلسة تصوير احترافية لقائمة الطعام، مع خطة محتوى لشهر واحد
